{% extends 'base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2 class="text-cyan">Cybersecurity Quiz</h2>
        <p class="text-muted">Answer the following questions to test your awareness. Good luck!</p>
    </div>
</div>

<form action="{{ url_for('submit_quiz') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    {% for q in questions %}
    <div class="card mb-4 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><strong>Question {{ loop.index }}</strong></span>
            <span class="badge bg-secondary">{{ q.category }}</span>
        </div>
        <div class="card-body">
            <h5 class="card-title mb-4">{{ q.question }}</h5>
            
            <div class="form-check quiz-option">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_A" value="A" required>
                <label class="form-check-label w-100" for="q{{ q.id }}_A">
                    A) {{ q.option_a }}
                </label>
            </div>
            
            <div class="form-check quiz-option">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_B" value="B">
                <label class="form-check-label w-100" for="q{{ q.id }}_B">
                    B) {{ q.option_b }}
                </label>
            </div>
            
            <div class="form-check quiz-option">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_C" value="C">
                <label class="form-check-label w-100" for="q{{ q.id }}_C">
                    C) {{ q.option_c }}
                </label>
            </div>
            
            <div class="form-check quiz-option">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_D" value="D">
                <label class="form-check-label w-100" for="q{{ q.id }}_D">
                    D) {{ q.option_d }}
                </label>
            </div>
        </div>
    </div>
    {% endfor %}
    
    <div class="d-grid mb-5">
        <button type="submit" class="btn btn-cyan btn-lg">Submit Quiz for Evaluation</button>
    </div>
</form>
{% endblock %}
